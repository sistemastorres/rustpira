[package]
name = "rustpira"
version = "0.1.0"
edition = "2024"
description = "Recordatorio de descansos residente para Windows 10/11"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "system-tray", "unstable-winit-030"] }
toml = "1.2.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.27.0"
